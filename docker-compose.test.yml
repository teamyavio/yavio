# Minimal Compose file for running integration tests locally and in CI.
# Uses tmpfs for RAM-backed databases (fast, data discarded on stop).
# Uses a separate project name and ports so dev containers are never affected.
# See: .specs/infrastructure/ci-cd.md §11.3
#
# Usage:
#   docker compose -f docker-compose.test.yml up -d
#   npm run test:integration
#   docker compose -f docker-compose.test.yml down

name: yavio-test

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: yavio_test
      POSTGRES_USER: yavio_service
      POSTGRES_PASSWORD: test
    ports:
      # Loopback only. The dev compose file has bound its datastores this way
      # since #42; this one was publishing a password-`test` Postgres to the
      # whole LAN from every developer's machine.
      - "127.0.0.1:${TEST_POSTGRES_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yavio_service"]
      interval: 3s
      timeout: 3s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    environment:
      CLICKHOUSE_PASSWORD: test
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "127.0.0.1:${TEST_CLICKHOUSE_PORT:-8124}:8123"
    tmpfs:
      - /var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--password", "test", "--query", "SELECT 1"]
      interval: 3s
      timeout: 3s
      retries: 5
