openapi: 3.1.0
info:
  title: Yavio Ingestion API
  version: 0.0.1
  description: |
    High-throughput event ingestion API for the Yavio analytics platform.
    Receives event batches from the server SDK and widget SDK, validates them,
    strips PII, and writes to ClickHouse.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://ingest.yavio.ai
    description: Yavio Cloud
  - url: http://localhost:3001
    description: Local development

security:
  - apiKey: []
  - widgetJwt: []

paths:
  /v1/events:
    post:
      operationId: ingestEvents
      summary: Ingest event batch
      description: |
        Receives a batch of analytics events from the server SDK or widget SDK.
        Events are validated, PII-stripped, and written to ClickHouse.

        A batch holds at most 1,000 events and 500 KB. Requests are rate
        limited by event count: per project for API keys (5,000-event burst,
        1,000 events/second), per widget token (project and trace) for widget
        JWTs (1,000-event burst, 50 events/second).

        Widget beacons (navigator.sendBeacon cannot set headers) send the
        same body as text/plain, at most 64 KiB, with the widget JWT in a
        `token` field. Without an Authorization header, any other request is
        refused with 401 before its body is read.
      tags:
        - Events
      security:
        - apiKey: []
        - widgetJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventBatchRequest"
      responses:
        "200":
          description: All events accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventBatchResponse"
        "207":
          description: Partial success — some events accepted, others rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartialEventBatchResponse"
        "400":
          description: |
            All events failed validation, empty request body, or a batch of
            more than 1,000 events. A batch over 1,000 events is rejected
            whole: `error.message` is "Batch exceeds 1000 events", `errors`
            holds one entry with `index: -1`, `rejected` is the number of
            events sent, and nothing in the batch is validated or stored.
            Such a batch is charged as 1,000 events to the rate limit, so
            it gets 429 instead while the credential's bucket holds fewer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchErrorResponse"
        "401":
          description: Missing, invalid, expired, or revoked credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: |
            Batch exceeds maximum allowed size (500 KB), or the request body
            is over 600,000 bytes (JSON) or 64 KiB (text/plain beacon); those
            are refused before they are read in full.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: |
            Rate limit exceeded: the API key's (YAVIO-2050) or the widget
            token's (YAVIO-2053) event budget, or the per-IP limit for
            requests that do not authenticate (YAVIO-2052).
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Backpressure — ClickHouse write buffer full
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/widget-tokens:
    post:
      operationId: createWidgetToken
      summary: Mint widget JWT
      description: |
        Mints a short-lived JWT for widget-side event ingestion. The JWT is
        scoped to a single trace and session, and expires after 15 minutes.
        Requires a valid project API key.
      tags:
        - Widget Tokens
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WidgetTokenRequest"
      responses:
        "200":
          description: Widget token minted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WidgetTokenResponse"
        "400":
          description: |
            Missing or invalid traceId or sessionId: each must be a string of
            at most 128 characters, the limit of the event field it must
            match.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid or revoked API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limited
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /health:
    get:
      operationId: healthCheck
      summary: Health check
      description: |
        Liveness probe. Returns 200 if the service is running and can reach
        both PostgreSQL and ClickHouse.
      tags:
        - Health
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Service is unhealthy — one or more dependencies are unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: |
        Project API key with `yav_` prefix. Obtained from the Yavio dashboard.
        Used by the server SDK for event ingestion and widget token minting.

    widgetJwt:
      type: http
      scheme: bearer
      description: |
        Short-lived JWT minted by the server-side proxy via POST /v1/widget-tokens.
        Used by the widget SDK for event ingestion. Scoped to a single trace,
        expires after 15 minutes.

  schemas:
    EventBatchRequest:
      type: object
      required:
        - events
      properties:
        events:
          type: array
          description: |
            1 to 1,000 events. A longer array is rejected whole with 400
            before any event in it is validated.
          items:
            $ref: "#/components/schemas/Event"
          minItems: 1
          maxItems: 1000

    Event:
      type: object
      required:
        - event_type
        - timestamp
        - trace_id
        - session_id
        - source
      properties:
        event_type:
          type: string
          enum:
            - tool_call
            - connection
            - resource_access
            - prompt_usage
            - sampling_call
            - elicitation
            - widget_response
            - tool_discovery
            - step
            - track
            - conversion
            - identify
            - widget_render
            - widget_error
            - widget_visibility
            - widget_click
            - widget_scroll
            - widget_form_field
            - widget_form_submit
            - widget_link_click
            - widget_navigation
            - widget_focus
            - widget_performance
            - widget_rage_click
        event_name:
          type: string
          maxLength: 256
        timestamp:
          type: string
          format: date-time
        trace_id:
          type: string
          maxLength: 128
        session_id:
          type: string
          maxLength: 128
        platform:
          type: string
          enum: [chatgpt, claude, cursor, vscode, windsurf, unknown]
        source:
          type: string
          enum: [server, widget]
        latency_ms:
          type: number
        status:
          type: string
          enum: [success, error]
        error_category:
          type: string
          enum: [auth, validation, timeout, rate_limit, server, unknown]
        error_message:
          type: string
          maxLength: 2048
        user_id:
          type: string
          maxLength: 256
        conversion_value:
          type: number
        conversion_currency:
          type: string
        metadata:
          type: object
          additionalProperties: true

    EventBatchResponse:
      type: object
      properties:
        accepted:
          type: integer
          description: Number of events accepted
        rejected:
          type: integer
          description: Number of events rejected (always 0 for 200)
        requestId:
          type: string
          description: Unique request identifier for tracing
        warnings:
          type: array
          items:
            type: string
          description: Field truncation warnings (omitted when empty)

    PartialEventBatchResponse:
      type: object
      properties:
        accepted:
          type: integer
        rejected:
          type: integer
          description: Number of events rejected, all of them
        errors:
          $ref: "#/components/schemas/EventErrors"
        requestId:
          type: string
          description: Unique request identifier for tracing
        warnings:
          type: array
          items:
            type: string
          description: Field truncation warnings (omitted when empty)

    EventErrors:
      type: array
      maxItems: 100
      description: |
        Per-event errors, at most 100: the first ones found. `rejected`
        counts every rejected event, so fewer entries than `rejected` means
        the list was cut. `index` is the event's position in the batch, or
        -1 for an error about the batch as a whole.
      items:
        type: object
        properties:
          index:
            type: integer
          issues:
            type: array
            items:
              type: string

    BatchErrorResponse:
      type: object
      properties:
        error:
          $ref: "#/components/schemas/ErrorEnvelope"
        accepted:
          type: integer
          description: Always 0
        rejected:
          type: integer
          description: Number of events rejected
        errors:
          $ref: "#/components/schemas/EventErrors"

    WidgetTokenRequest:
      type: object
      required:
        - traceId
        - sessionId
      properties:
        traceId:
          type: string
          minLength: 1
          maxLength: 128
        sessionId:
          type: string
          minLength: 1
          maxLength: 128

    WidgetTokenResponse:
      type: object
      properties:
        token:
          type: string
          description: Short-lived JWT for widget event ingestion
        expiresAt:
          type: string
          format: date-time

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded]
        postgres:
          type: string
          enum: [up, down]
        clickhouse:
          type: string
          enum: [up, down]

    ErrorResponse:
      type: object
      properties:
        error:
          $ref: "#/components/schemas/ErrorEnvelope"

    ErrorEnvelope:
      type: object
      description: Nested error envelope
      properties:
        code:
          type: string
          description: Yavio error code (e.g., YAVIO-2001)
        message:
          type: string
        status:
          type: integer
          description: HTTP status code
        requestId:
          type: string
          description: Unique request identifier for tracing
        metadata:
          type: object
          additionalProperties: true
          description: Additional error context (optional)
