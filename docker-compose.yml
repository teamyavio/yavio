# Yavio Platform — Docker Compose (Development)
# Starts PostgreSQL + ClickHouse for local development.
# See: .specs/infrastructure/deployment.md §9.1.1
#
# Usage:
#   ./scripts/setup-env.sh        # generate .env with random secrets
#   docker compose up -d
#   docker compose ps              # verify health checks pass

# Container logs (#92). Without options Docker keeps a container's log for as
# long as the container exists. The json-file driver rotates by size, not by
# age: at most 5 x 25 MB per container. docker-compose.prod.yml sets its own
# sizes; ops/host/docker-daemon.json covers containers started outside compose.
x-logging: &logging
  driver: json-file
  options:
    max-size: "25m"
    max-file: "5"

services:
  postgres:
    logging: *logging
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: yavio
      POSTGRES_USER: yavio_service
      POSTGRES_PASSWORD: ${POSTGRES_SERVICE_PASSWORD:?POSTGRES_SERVICE_PASSWORD is not set. Run ./scripts/setup-env.sh, or add it to .env — it must never fall back to a published default. This role is the Postgres superuser.}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yavio_service -d yavio"]
      interval: 5s
      timeout: 5s
      retries: 5

  clickhouse:
    logging: *logging
    # Exact pin, upgrades are one-way (#95). Dependabot proposes patch updates;
    # docker-compose.test.yml must carry the same tag (ch-image-pins.test.ts).
    image: clickhouse/clickhouse-server:26.8.26.12
    restart: unless-stopped
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is not set. Run ./scripts/setup-env.sh, or add it to .env — it must never fall back to a published default. This user is unrestricted and can manage access.}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      # Retention for ClickHouse's own logs and logger level (#92).
      - ./packages/db/clickhouse/config.d/system-logs.xml:/etc/clickhouse-server/config.d/yavio-system-logs.xml:ro
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "127.0.0.1:${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    networks:
      - backend
    healthcheck:
      # Read the password from the container's own environment at run time
      # rather than interpolating it here. Compose bakes an interpolated value
      # into the container config, where `docker inspect` prints it in full —
      # a live password was exposed that way on 2026-08-04 and had to be
      # rotated. `$$` escapes to a literal `$`, so the shell inside the
      # container expands it instead of compose.
      #
      # This does NOT hide the password from `docker inspect` entirely: the
      # ClickHouse image needs CLICKHOUSE_PASSWORD in its environment to set
      # the default user, so it remains visible under .Config.Env. What it
      # removes is the second, easily-overlooked copy in the health command.
      test: ["CMD-SHELL", "clickhouse-client --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    logging: *logging
    build:
      context: .
      dockerfile: packages/db/Dockerfile
    environment:
      DATABASE_URL: postgres://yavio_service:${POSTGRES_SERVICE_PASSWORD:?POSTGRES_SERVICE_PASSWORD is not set. Run ./scripts/setup-env.sh, or add it to .env — it must never fall back to a published default. This role is the Postgres superuser.}@postgres:5432/yavio
      CLICKHOUSE_URL: http://default:${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is not set. Run ./scripts/setup-env.sh, or add it to .env — it must never fall back to a published default. This user is unrestricted and can manage access.}@clickhouse:8123
      # Applied to their ClickHouse users by migrate-clickhouse.ts after
      # migrations run — migration 0007 creates them with a published literal.
      CLICKHOUSE_INGEST_PASSWORD: ${CLICKHOUSE_INGEST_PASSWORD:-}
      CLICKHOUSE_DASHBOARD_PASSWORD: ${CLICKHOUSE_DASHBOARD_PASSWORD:-}
      CLICKHOUSE_ERASER_PASSWORD: ${CLICKHOUSE_ERASER_PASSWORD:-}
      CLICKHOUSE_ROLLUP_PASSWORD: ${CLICKHOUSE_ROLLUP_PASSWORD:-}
      # Applied to the yavio_app role by migrate.ts after migrations run.
      # Compose-injected environment is NOT inherited from .env, so omitting this
      # left yavio_app on the published 'yavio_dev' from 0001 even for operators
      # who ran setup-env.sh and followed every documented step — the host-side
      # `pnpm migrate` reads .env directly and repaired it, this path did not.
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-}
      # Applied to the yavio_api role by migrate.ts after migrations run.
      POSTGRES_API_PASSWORD: ${POSTGRES_API_PASSWORD:?POSTGRES_API_PASSWORD is not set. Run ./scripts/setup-env.sh, or add it to .env — it must never fall back to a published default.}
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  ingest:
    logging: *logging
    build:
      context: .
      dockerfile: packages/ingest/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://yavio_api:${POSTGRES_API_PASSWORD:?POSTGRES_API_PASSWORD is not set. Run ./scripts/setup-env.sh, or add it to .env — it must never fall back to a published default.}@postgres:5432/yavio
      CLICKHOUSE_URL: http://default:${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is not set. Run ./scripts/setup-env.sh, or add it to .env — it must never fall back to a published default. This user is unrestricted and can manage access.}@clickhouse:8123
      # This service narrows the ClickHouse username; when set it uses that
      # user's own password instead of the default user's.
      CLICKHOUSE_INGEST_PASSWORD: ${CLICKHOUSE_INGEST_PASSWORD:-}
      # The statistics job's own user (#85); unset disables the job.
      CLICKHOUSE_ROLLUP_PASSWORD: ${CLICKHOUSE_ROLLUP_PASSWORD:-}
      API_KEY_HASH_SECRET: ${API_KEY_HASH_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      PORT: "3001"
      # Address(es) of the reverse proxy in front of ingest, whose
      # X-Forwarded-For is trusted (#94). Empty: request.ip is the socket peer.
      # With a proxy on the host, use docker-compose.proxy.yml and see the
      # self-hosting docs for which address to list.
      TRUST_PROXY: ${TRUST_PROXY:-}
    ports:
      # BIND_ADDRESS=127.0.0.1 when a reverse proxy on this host is the only
      # way in; the default publishes on all interfaces (#94).
      - "${BIND_ADDRESS:-0.0.0.0}:${INGEST_PORT:-3001}:3001"
    networks:
      - frontend
      - backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/health').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 5

  dashboard:
    logging: *logging
    build:
      context: .
      dockerfile: packages/dashboard/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://yavio_api:${POSTGRES_API_PASSWORD:?POSTGRES_API_PASSWORD is not set. Run ./scripts/setup-env.sh, or add it to .env — it must never fall back to a published default.}@postgres:5432/yavio
      CLICKHOUSE_URL: http://default:${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is not set. Run ./scripts/setup-env.sh, or add it to .env — it must never fall back to a published default. This user is unrestricted and can manage access.}@clickhouse:8123
      # This service narrows the ClickHouse username; when set it uses that
      # user's own password instead of the default user's.
      CLICKHOUSE_DASHBOARD_PASSWORD: ${CLICKHOUSE_DASHBOARD_PASSWORD:-}
      # Erasure only: ALTER DELETE on default.events and nothing else. Required:
      # the dashboard refuses to start without it rather than erasing as the
      # superuser (#91).
      CLICKHOUSE_ERASER_PASSWORD: ${CLICKHOUSE_ERASER_PASSWORD:?CLICKHOUSE_ERASER_PASSWORD is not set. Run ./scripts/setup-env.sh, or add it to .env — the dashboard erases data as the yavio_eraser user and no longer falls back to the superuser.}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      API_KEY_HASH_SECRET: ${API_KEY_HASH_SECRET}
      APP_URL: ${APP_URL:-http://localhost:3000}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-contact@yavio.ai}
      # Dogfooding: the MCP server at /api/mcp reports its own usage to Yavio.
      # Unset by default — the SDK is a transparent no-op without a key, so
      # self-hosters get no outbound telemetry unless they opt in.
      YAVIO_API_KEY: ${YAVIO_API_KEY:-}
      YAVIO_ENDPOINT: ${YAVIO_ENDPOINT:-}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${DASHBOARD_PORT:-3000}:3000"
    networks:
      - frontend
      - backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 3

  docs:
    logging: *logging
    build:
      context: .
      dockerfile: packages/docs/Dockerfile
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${DOCS_PORT:-3002}:3000"
    networks:
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  clickhouse_data:

networks:
  frontend:    # Public-facing services (ingest, dashboard) — added when app services are introduced
  backend:     # Internal services (databases)
