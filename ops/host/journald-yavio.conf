# systemd-journald drop-in (#92): /etc/systemd/journald.conf.d/yavio.conf
# The journal holds the host's own logs — the reverse proxy's runtime log
# among them — and by default keeps them until a size cap, which can mean
# months. Keep 30 days, and never more than 1 GB.
# Apply: systemctl restart systemd-journald
[Journal]
MaxRetentionSec=30day
SystemMaxUse=1G
