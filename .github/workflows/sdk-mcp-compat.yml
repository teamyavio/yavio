name: SDK × MCP SDK

# @yavio/sdk patches McpServer internals that are not public API (the tool
# registry, the low-level request handlers) and declares the MCP SDK as a peer
# with an open upper bound. ci.yml tests only the lockfile version; this tests
# both ends of the range: the declared floor and the current release. It runs
# weekly too, so a breaking MCP SDK release shows up here before an app
# upgrades into it (#84).
#
# MCP SDK v2 is a separate package family (@modelcontextprotocol/server,
# /client, /node — #133); the `server-v2` leg tests its current release.
#
# Unlike ci.yml this runs for pull requests into any branch, so stacked SDK
# PRs get tested as well.

on:
  pull_request:
    paths:
      - "packages/sdk/**"
      - "packages/shared/**"
      - ".github/workflows/sdk-mcp-compat.yml"
  push:
    branches: [main]
    paths:
      - "packages/sdk/**"
      - "packages/shared/**"
      - ".github/workflows/sdk-mcp-compat.yml"
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-mcp-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: MCP SDK ${{ matrix.mcp-sdk }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mcp-sdk: [floor, latest, server-v2]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup

      - name: Resolve the version
        id: mcp
        run: |
          if [ "${{ matrix.mcp-sdk }}" = floor ]; then
            # Single source: the peer range in packages/sdk/package.json.
            range=$(node -p "require('./packages/sdk/package.json').peerDependencies['@modelcontextprotocol/sdk']")
            if [[ ! "$range" =~ ^\>=([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              echo "::error::expected a '>=X.Y.Z' peer range for @modelcontextprotocol/sdk, got '$range'"
              exit 1
            fi
            version="${BASH_REMATCH[1]}"
            package=@modelcontextprotocol/sdk
          elif [ "${{ matrix.mcp-sdk }}" = server-v2 ]; then
            # The v2 family moves together; the server's version is the one
            # checked, client and node follow their own latest.
            version=$(npm view @modelcontextprotocol/server version)
            package=@modelcontextprotocol/server
          else
            version=$(npm view @modelcontextprotocol/sdk version)
            package=@modelcontextprotocol/sdk
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "package=$package" >> "$GITHUB_OUTPUT"

      - name: Install ${{ steps.mcp.outputs.package }}@${{ steps.mcp.outputs.version }}
        run: |
          if [ "${{ matrix.mcp-sdk }}" = server-v2 ]; then
            pnpm --filter @yavio/sdk add -D \
              "@modelcontextprotocol/server@${{ steps.mcp.outputs.version }}" \
              "@modelcontextprotocol/client@latest" \
              "@modelcontextprotocol/node@latest"
          else
            pnpm --filter @yavio/sdk add -D "@modelcontextprotocol/sdk@${{ steps.mcp.outputs.version }}"
          fi

      # A matrix leg that silently tests the lockfile version would be green
      # for the wrong reason.
      - name: Check the installed version
        run: |
          installed=$(node -p "require('./packages/sdk/node_modules/${{ steps.mcp.outputs.package }}/package.json').version")
          echo "Testing against ${{ steps.mcp.outputs.package }} $installed"
          if [ "$installed" != "${{ steps.mcp.outputs.version }}" ]; then
            echo "::error::expected ${{ steps.mcp.outputs.version }}, installed $installed"
            exit 1
          fi

      - run: pnpm turbo build --filter=@yavio/sdk...
      - run: pnpm --filter @yavio/sdk exec vitest run
      # Installs the tarball next to this MCP SDK version.
      - run: pnpm --filter @yavio/sdk run check:package
